# echoIRCd — sujets d'AIDE intégrés (Français). Voir help/en.conf pour le format.
# Seule la prose est traduite ; les commandes, lettres de mode et jetons restent
# tels quels. Un sujet absent retombe sur l'anglais.

[INDEX]
Tapez HELP <sujet> pour le détail. Sujets : CHANNELS CHMODES SERVICES OPER.
Salons : JOIN PART TOPIC MODE KICK INVITE NAMES LIST WHO WHOIS.
Modes : HELP CHMODES liste chaque mode de salon et son rôle.
Messages : PRIVMSG, NOTICE, et AWAY pour vous marquer absent.
Comptes : authentifiez-vous par SASL, ou écrivez à NickServ (/NS).

[CHANNELS]
JOIN #salon [clé]     rejoindre (ou créer) un salon
PART #salon [:raison] quitter un salon
MODE #salon [+modes]  voir ou définir les modes du salon
TOPIC #salon :texte   définir le sujet (droit +t requis)
KICK #salon pseudo    expulser un utilisateur (op/halfop requis)
INVITE pseudo #salon  inviter un utilisateur dans un salon
Voir CHMODES pour la liste complète des modes de salon.

[CHMODES]
Modes de salon — MODE #salon +/-<lettres> [params]
Accès :   +i sur-invitation  +k clé  +l limite  +R inscrits  +O opers  +z TLS
Parole :  +m modéré  +n pas-externe  +M inscrits  +u modéré-op  +t sujet-verrou
          +d <sec> avant que les nouveaux puissent parler
Masquer : +s secret  +p privé  +D join-différé (caché jusqu'à ce qu'il parle)
Filtre :  +c sans-couleur  +S retire-couleur  +C sans-CTCP  +T sans-notice  +G censure
Flood :   +f lignes:sec  +j joins:sec  +F flood-pseudo  +B anti-majuscules  +H historique
Listes :  +b ban  +e exempt  +I exempt-invite  +g filtre-spam  +w auto-op
Statut (pseudo requis) : +q fondateur ~  +a admin &  +o op @  +h halfop %  +v voix +
Référence complète : https://echoircd.org/docs/channel-modes

[SERVICES]
Enregistrer/s'identifier avec NickServ : /NS REGISTER, /NS IDENTIFY.
Propriété d'un salon via ChanServ : /CS REGISTER #salon.
Les alias /NS /CS /MS /OS /BS /HS écrivent au service correspondant.

[OPER]
OPER <nom> <passe>    devenir opérateur IRC
KILL pseudo :raison   déconnecter un utilisateur
KLINE/GLINE/ZLINE     bannir un masque (les bans réseau se propagent)
SAMODE/SAJOIN/SAKICK  agir avec l'autorité des services
REHASH                recharger la configuration
