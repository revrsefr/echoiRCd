# echoIRCd — temas de AYUDA integrados (Español). Ver help/en.conf para el formato.
# Solo se traduce la prosa; comandos, letras de modo y tokens quedan igual.
# Un tema ausente recae en inglés.

[INDEX]
Use HELP <tema> para el detalle. Temas: CHANNELS CHMODES SERVICES OPER.
Canales: JOIN PART TOPIC MODE KICK INVITE NAMES LIST WHO WHOIS.
Modos: HELP CHMODES lista cada modo de canal y qué hace.
Mensajes: PRIVMSG, NOTICE, y AWAY para marcarte ausente.
Cuentas: autentícate con SASL, o escribe a NickServ (/NS).

[CHANNELS]
JOIN #canal [clave]   entrar (o crear) un canal
PART #canal [:motivo] salir de un canal
MODE #canal [+modos]  ver o fijar los modos del canal
TOPIC #canal :texto   fijar el tema (requiere +t)
KICK #canal apodo     expulsar a un usuario (op/halfop)
INVITE apodo #canal   invitar a un usuario a un canal
Ver CHMODES para la lista completa de modos de canal.

[CHMODES]
Modos de canal — MODE #canal +/-<letras> [params]
Entrar:  +i solo-invitación  +k clave  +l límite  +R registrados  +O opers  +z TLS
Hablar:  +m moderado  +n sin-externos  +M registrados  +u moderado-op  +t tema-fijo
         +d <seg> antes de que los nuevos hablen
Ocultar: +s secreto  +p privado  +D join-diferido (oculto hasta que hable)
Filtro:  +c sin-color  +S quita-color  +C sin-CTCP  +T sin-notice  +G censura
Flood:   +f líneas:seg  +j joins:seg  +F flood-apodo  +B anti-mayúsculas  +H historial
Listas:  +b ban  +e exento  +I exento-invitación  +g filtro-spam  +w auto-op
Estado (requiere apodo): +q fundador ~  +a admin &  +o op @  +h halfop %  +v voz +
Referencia completa: https://echoircd.org/docs/channel-modes

[SERVICES]
Regístrate/identifícate con NickServ: /NS REGISTER, /NS IDENTIFY.
Propiedad de canal vía ChanServ: /CS REGISTER #canal.
Los alias /NS /CS /MS /OS /BS /HS escriben al servicio correspondiente.

[OPER]
OPER <nombre> <clave>  hacerte operador de IRC
KILL apodo :motivo     desconectar a un usuario
KLINE/GLINE/ZLINE      vetar una máscara (los vetos de red se propagan)
SAMODE/SAJOIN/SAKICK   actuar con autoridad de servicios
REHASH                 recargar la configuración
