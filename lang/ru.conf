# echoIRCd — каталог сообщений: русский (ru)
# Формат: "английский текст (msgid)" = "перевод"
# Переводится только текст для человека; протокольные токены (+i, SASL, RELAYMSG,
# имена команд, буквы режимов) остаются без изменений. Отсутствующая запись
# возвращается к английскому варианту.

# --- приветствие (001-004): динамический текст, шаблоны {0}/{1} ---
"Welcome to the {0} IRC Network, {1}" = "Добро пожаловать в сеть IRC {0}, {1}"
"Your host is {0}, running echoircd-{1}" = "Ваш хост — {0}, версия echoircd-{1}"
"This server was created at unix {0}" = "Этот сервер был создан (unix) {0}"
"There are {0} users on 1 server" = "На 1 сервере {0} пользователей"

# --- rehash / конфигурация (уведомления сервера) ---
"Server configuration reloaded." = "Конфигурация сервера перезагружена."
"admin {0} has changed the configuration of the server." = "администратор {0} изменил конфигурацию сервера."
"{0} is rehashing the server config file." = "{0} перезагружает файл конфигурации сервера."
"{0} tried to reload the server configuration, but the config file could not be read — no changes were made." = "{0} попытался перезагрузить конфигурацию сервера, но файл конфигурации не удалось прочитать — изменения не внесены."
"Could not read {0} — the running configuration was kept." = "Не удалось прочитать {0} — сохранена текущая конфигурация."

