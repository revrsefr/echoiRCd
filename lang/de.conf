# echoIRCd — Nachrichtenkatalog: Deutsch (de)
# Format: "englischer Text (msgid)" = "Übersetzung"
# Nur der menschenlesbare Text wird übersetzt; Protokoll-Token (+i, SASL, RELAYMSG,
# Befehlsnamen, Mode-Buchstaben) bleiben unverändert. Eine fehlende Eintragung
# fällt auf Englisch zurück.

# --- Begrüßung (001-004): dynamischer Text, Platzhalter {0}/{1} ---
"Welcome to the {0} IRC Network, {1}" = "Willkommen im {0} IRC-Netzwerk, {1}"
"Your host is {0}, running echoircd-{1}" = "Dein Host ist {0}, mit echoircd-{1}"
"This server was created at unix {0}" = "Dieser Server wurde erstellt am (unix) {0}"
"There are {0} users on 1 server" = "Es gibt {0} Benutzer auf 1 Server"

