# echoIRCd — catalogue de messages : Français (fr)
# Format : "texte anglais (msgid)" = "traduction"
# Seul le texte humain est traduit ; les jetons de protocole (+i, SASL, RELAYMSG,
# noms de commandes, lettres de mode) restent tels quels. Une entrée absente
# retombe sur l'anglais.

# --- notices / défis ---
"*** Cloudflare Challenge: verification successful — you may continue." = "*** Défi Cloudflare : vérification réussie — vous pouvez continuer."
"*** Correct — you may now message freely; please resend your message." = "*** Correct — vous pouvez maintenant envoyer des messages librement ; veuillez renvoyer votre message."
"*** Flood detected — slow down" = "*** Flood détecté — ralentissez"
"*** NickServ: welcome back" = "*** NickServ : bon retour"
"*** OJOIN is not enabled on this server." = "*** OJOIN n'est pas activé sur ce serveur."
"*** TITLE: invalid title name or password." = "*** TITLE : nom de titre ou mot de passe invalide."
"*** reCAPTCHA: verification successful — you may continue." = "*** reCAPTCHA : vérification réussie — vous pouvez continuer."

