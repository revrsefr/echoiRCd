# echoIRCd — catalogue de messages : Français (fr)
# Format : "texte anglais (msgid)" = "traduction"
# Seul le texte humain est traduit ; les jetons de protocole (+i, SASL, RELAYMSG,
# noms de commandes, lettres de mode) restent tels quels. Une entrée absente
# retombe sur l'anglais.

# --- accueil (001-004) : prose dynamique, gabarits {0}/{1} ---
"Welcome to the {0} IRC Network, {1}" = "Bienvenue sur le réseau IRC {0}, {1}"
"Your host is {0}, running echoircd-{1}" = "Votre hôte est {0}, sous echoircd-{1}"
"This server was created at unix {0}" = "Ce serveur a été créé le (unix) {0}"
"There are {0} users on 1 server" = "Il y a {0} utilisateurs sur 1 serveur"

# --- rehash / configuration (notices serveur) ---
"Server configuration reloaded." = "Configuration du serveur rechargée."
"admin {0} has changed the configuration of the server." = "l'administrateur {0} a modifié la configuration du serveur."
"{0} is rehashing the server config file." = "{0} recharge le fichier de configuration du serveur."
"{0} tried to reload the server configuration, but the config file could not be read — no changes were made." = "{0} a tenté de recharger la configuration du serveur, mais le fichier de configuration n'a pas pu être lu — aucune modification n'a été effectuée."
"Could not read {0} — the running configuration was kept." = "Impossible de lire {0} — la configuration en cours a été conservée."

