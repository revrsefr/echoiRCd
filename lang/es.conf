# echoIRCd — catálogo de mensajes: Español (es)
# Formato: "texto en inglés (msgid)" = "traducción"
# Solo se traduce el texto humano; los tokens de protocolo (+i, SASL, RELAYMSG,
# nombres de comandos, letras de modo) se mantienen. Una entrada ausente
# recae en el inglés.

# --- avisos / desafíos ---
"*** Cloudflare Challenge: verification successful — you may continue." = "*** Desafío de Cloudflare: verificación exitosa — puedes continuar."
"*** Correct — you may now message freely; please resend your message." = "*** Correcto — ya puedes enviar mensajes libremente; por favor reenvía tu mensaje."
"*** Flood detected — slow down" = "*** Flood detectado — más despacio"
"*** NickServ: welcome back" = "*** NickServ: bienvenido de nuevo"
"*** OJOIN is not enabled on this server." = "*** OJOIN no está habilitado en este servidor."
"*** TITLE: invalid title name or password." = "*** TITLE: nombre de título o contraseña inválidos."
"*** reCAPTCHA: verification successful — you may continue." = "*** reCAPTCHA: verificación exitosa — puedes continuar."

