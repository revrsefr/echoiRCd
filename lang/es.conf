# echoIRCd — catálogo de mensajes: Español (es)
# Formato: "texto en inglés (msgid)" = "traducción"
# Solo se traduce el texto humano; los tokens de protocolo (+i, SASL, RELAYMSG,
# nombres de comandos, letras de modo) se mantienen. Una entrada ausente
# recae en el inglés.

# --- bienvenida (001-004): prosa dinámica, plantillas {0}/{1} ---
"Welcome to the {0} IRC Network, {1}" = "Bienvenido a la red IRC {0}, {1}"
"Your host is {0}, running echoircd-{1}" = "Tu host es {0}, ejecutando echoircd-{1}"
"This server was created at unix {0}" = "Este servidor fue creado el (unix) {0}"
"There are {0} users on 1 server" = "Hay {0} usuarios en 1 servidor"

# --- rehash / configuración (avisos del servidor) ---
"Server configuration reloaded." = "Configuración del servidor recargada."
"admin {0} has changed the configuration of the server." = "el administrador {0} ha cambiado la configuración del servidor."
"{0} is rehashing the server config file." = "{0} está recargando el archivo de configuración del servidor."
"{0} tried to reload the server configuration, but the config file could not be read — no changes were made." = "{0} intentó recargar la configuración del servidor, pero no se pudo leer el archivo de configuración — no se hicieron cambios."
"Could not read {0} — the running configuration was kept." = "No se pudo leer {0} — se mantuvo la configuración en curso."

