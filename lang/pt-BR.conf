# echoIRCd — catálogo de mensagens: Português do Brasil (pt-BR)
# Formato: "texto em inglês (msgid)" = "tradução"
# Somente o texto humano é traduzido; os tokens de protocolo (+i, SASL, RELAYMSG,
# nomes de comandos, letras de modo) permanecem como estão. Uma entrada ausente
# recai no inglês.

# --- boas-vindas (001-004): prosa dinâmica, modelos {0}/{1} ---
"Welcome to the {0} IRC Network, {1}" = "Bem-vindo à rede IRC {0}, {1}"
"Your host is {0}, running echoircd-{1}" = "Seu host é {0}, executando echoircd-{1}"
"This server was created at unix {0}" = "Este servidor foi criado em (unix) {0}"
"There are {0} users on 1 server" = "Há {0} usuários em 1 servidor"

