# echoIRCd — catalogo dei messaggi: Italiano (it)
# Formato: "testo inglese (msgid)" = "traduzione"
# Viene tradotto solo il testo leggibile dall'utente; i token di protocollo (+i, SASL,
# RELAYMSG, nomi dei comandi, lettere di modo) restano invariati. Una voce assente
# ricade sull'inglese.

# --- benvenuto (001-004): prosa dinamica, modelli {0}/{1} ---
"Welcome to the {0} IRC Network, {1}" = "Benvenuto sulla rete IRC {0}, {1}"
"Your host is {0}, running echoircd-{1}" = "Il tuo host è {0}, con echoircd-{1}"
"This server was created at unix {0}" = "Questo server è stato creato il (unix) {0}"
"There are {0} users on 1 server" = "Ci sono {0} utenti su 1 server"

